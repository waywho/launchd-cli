name: Release

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, closed]
    branches: [main]

jobs:
  check-labels:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the release labels
        uses: waywho/pr-to-release@v1

  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pr-to-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - id: release
        uses: waywho/pr-to-release@v1
      - if: steps.release.outputs.released == 'true'
        run: ./build.sh && gh release upload "${{ steps.release.outputs.tag }}" dist/* install.sh install.ps1
        env:
          GH_TOKEN: ${{ github.token }}
